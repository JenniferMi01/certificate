# --- Odoo API response cache ---
proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=odoo_cache:10m max_size=100m inactive=5m;

upstream django_backend {
    server backend:8000;
    keepalive 32;
}

upstream odoo_api_upstream {
    server odoo_api:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml
        application/font-woff2;
    gzip_min_length 256;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Shared proxy defaults ---
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;

    # =============================================
    # DJANGO  —  /django/*  (strip prefix)
    #   /django/api/*    -> backend:8000/api/*
    #   /django/admin/*  -> backend:8000/admin/*
    #   /django/static/* -> served by nginx
    # =============================================

    # Django static files — served directly by nginx from shared volume
    location /django/static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Django admin — strip /django prefix
    location /django/admin/ {
        rewrite ^/django/(.*)$ /$1 break;
        proxy_pass http://django_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-CSRFToken $http_x_csrftoken;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Django REST API — strip /django prefix
    location /django/api/ {
        rewrite ^/django/(.*)$ /$1 break;
        proxy_pass http://django_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Backward-compatible direct routes (frontend uses these) ---

    # /static/ -> Django staticfiles
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /admin/ -> Django admin
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-CSRFToken $http_x_csrftoken;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # /api/ -> Django REST API
    location /api/ {
        proxy_pass http://django_backend;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # =============================================
    # ODOO API  —  /odoo/*  (strip prefix)
    #   /odoo/employees   -> odoo_api:5000/employees
    #   /odoo/partners    -> odoo_api:5000/partners
    # =============================================

    location /api/odoo/ {
        rewrite ^/api/odoo/(.*)$ /$1 break;
        proxy_pass http://odoo_api_upstream;

        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Cache GET responses for 5 min (employee list is stable)
        proxy_cache odoo_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_methods GET;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # =============================================
    # REACT FRONTEND — SPA
    # =============================================

    # Vite-built assets (hashed filenames = safe to cache forever)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Never cache index.html (so new deploys are instant)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
