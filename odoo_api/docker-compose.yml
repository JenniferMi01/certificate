services:
  odoo_api:
    build: .
    container_name: odoo_api_container
    ports:
      - "5000:5000"
    environment:
      - ODOO_URL=${ODOO_URL}
      - ODOO_DB=${ODOO_DB}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/partners', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s