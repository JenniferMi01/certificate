services:
  db:
    image: postgres:16-alpine
    container_name: certificate_database
    ports:
      - "5432:5432"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: certificate_backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - static_files:/app/staticfiles
      - backup_data:/app/backups

  frontend:
    build: ./frontend
    container_name: certificate_frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend
      - odoo_api
    volumes:
      - static_files:/app/staticfiles:ro

  odoo_api:
    build: ./odoo_api
    container_name: certificate_odoo_api
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/partners', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  static_files:
  backup_data:
