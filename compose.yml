services:
  db:
    image: postgres:16-alpine
    container_name: certificate_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: certificate_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: certificate_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: django-insecure-change-me-in-production
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgresql://postgres:postgres@db:5432/certificate_db
      CORS_ALLOWED_ORIGINS: http://localhost,http://frontend
    volumes:
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: certificate_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  odoo_api:
    build: ./odoo_api
    container_name: certificate_odoo_api
    ports:
      - "5000:5000"
    environment:
      - ODOO_URL=${ODOO_URL}
      - ODOO_DB=${ODOO_DB}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/partners', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  static_files:
