services:
  db:
    image: postgres:16-alpine
    container_name: certificate_database
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certificate_db}
      POSTGRES_USER: ${POSTGRES_USER:-certificate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certificate_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d  ${POSTGRES_DB} -U ${POSTGRES_USER} -h localhost -p 5432 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: certificate_backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Django Environment Variables
      - SECRET_KEY=django-insecure-development-key-for-docker
      - DEBUG=1
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,197.158.64.13,certificate-dev.blueline.mg,certificate.blueline.mg

      # Database Configuration
      - DATABASE_URL=postgresql://certificate_user:certificate_password@db:5432/certificate_db

      # CORS Settings
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:8080,http://frontend,http://197.158.64.13,http://197.158.64.13:8080,http://certificate-dev.blueline.mg,http://certificate.blueline.mg

      # Static Files
      - STATIC_URL=/static/
      - STATIC_ROOT=/app/staticfiles
    env_file:
      - .env
    volumes:
      - static_files:/app/staticfiles
      - backup_data:/app/backups

  frontend:
    build: ./frontend
    container_name: certificate_frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
      - odoo_api
    volumes:
      - static_files:/app/staticfiles:ro

  odoo_api:
    build: ./odoo_api
    container_name: certificate_odoo_api
    ports:
      - "5000:5000"
    environment:
      - ODOO_URL=${ODOO_URL}
      - ODOO_DB=${ODOO_DB}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/partners', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  static_files:
  backup_data:
